name: Pages

on:
  push:
    branches:
      - 'master'

jobs:
  build:
    name: Publish Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0    # full history and tags, for git describe

      # Show the version in the documentation. The Doxyfile leaves
      # PROJECT_NUMBER empty; a later assignment overrides it.
      - name: Set documentation version
        run: echo "PROJECT_NUMBER = $(git describe --tags --always)" >> Doxyfile

      - name: Generate Doxygen
        uses: mattnotmitt/doxygen-action@v1

      - name: Publish
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
